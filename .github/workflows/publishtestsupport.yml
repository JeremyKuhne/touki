# Publishes the TestSupport package on its own tag stream (`ts-v*`).
# TestSupport is rarely changed, so it gets an independent version axis from
# the main `KlutzyNinja.Touki` package; cutting a release means pushing a
# tag like `ts-v0.2.0` (matching the MinVerTagPrefix in
# touki.testsupport.csproj).
#
# `workflow_dispatch` is also supported for ad-hoc republishes; it requires
# the caller to supply the existing tag they want to publish, which the
# workflow then checks out and validates. This avoids accidentally
# publishing a `0.0.0-alpha.0.<height>` MinVer fallback by dispatching
# from `main` with no tag context.

name: Publish TestSupport NuGet Package

on:
  push:
    tags: ['ts-v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. ts-v0.1.0-alpha.9)'
        required: true
        type: string

jobs:
  publish:
    name: ".NET / Publish"
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    env:
      # `github.ref_name` for push, the dispatched input for manual runs.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
    - name: Validate tag format
      shell: pwsh
      run: |
        $tag = $env:RELEASE_TAG
        if (!$tag.StartsWith('ts-v', [System.StringComparison]::Ordinal)) {
          Write-Error "Tag '$tag' is not a TestSupport release tag."
          exit 1
        }

        $version = $tag.Substring('ts-v'.Length)
        # SemVer 2.0 without build metadata. Numeric identifiers cannot have leading zeroes.
        $identifier = '(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
        $versionPattern = "^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-$identifier(?:\.$identifier)*)?$"
        if ($version -notmatch $versionPattern) {
          Write-Error "Tag '$tag' does not contain a valid release version."
          exit 1
        }

        Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"
        Write-Host "Tag '$tag' OK."
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Pack
      run: |
        dotnet pack touki.testsupport/touki.testsupport.csproj `
          --configuration Release `
          --no-build `
          --output ./artifacts `
          -p:Platform=AnyCPU `
          -p:Platforms=AnyCPU
    - name: Verify package
      # touki.testsupport is a pure-IL library with no native components and
      # must load on any CPU architecture (x64, ARM64, ...). touki.slnx maps
      # it to Platform=AnyCPU even though the rest of the solution defaults
      # to x64 (see Directory.Build.props); this guards against that mapping
      # regressing before anything is pushed to NuGet.
      run: |
        $packages = @(
          Get-ChildItem ./artifacts -Filter KlutzyNinja.Touki.TestSupport.*.nupkg
        )
        if ($packages.Count -ne 1) {
          throw "Expected one TestSupport package, found $($packages.Count)."
        }

        $actualVersion = $packages[0].BaseName.Substring('KlutzyNinja.Touki.TestSupport.'.Length)
        if ($actualVersion -ne $env:RELEASE_VERSION) {
          throw "TestSupport package version '$actualVersion' does not match tag version '$env:RELEASE_VERSION'."
        }

        pwsh tools/Test-PackageArchitectureNeutral.ps1 -PackagePath $packages[0].FullName
        if ($LASTEXITCODE -ne 0) {
          throw "Architecture validation failed for '$($packages[0].Name)'."
        }
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet
      run: |
        $packages = @(
          Get-ChildItem -Path ./artifacts -Filter KlutzyNinja.Touki.TestSupport.*.nupkg
        )
        if ($packages.Count -ne 1) {
          throw "Expected one TestSupport package to publish, found $($packages.Count)."
        }

        dotnet nuget push $packages[0].FullName `
            --api-key ${{steps.login.outputs.NUGET_API_KEY}} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
        if ($LASTEXITCODE -ne 0) {
          throw "Publishing '$($packages[0].Name)' failed with exit code $LASTEXITCODE."
        }
